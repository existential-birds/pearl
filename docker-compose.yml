services:
  db:
    image: pgvector/pgvector:pg18
    ports:
      - "${PEARL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pearl_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pearl:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/existential-birds/pearl:latest
    ports:
      - "${PORT:-4000}:4000"
    environment:
      DATABASE_URL: "ecto://postgres:postgres@db:5432/pearl_prod"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-super-secret-key-base-that-is-at-least-64-bytes-long-for-production-use-please-change}"
      PHX_HOST: "${PHX_HOST:-localhost}"
      PHX_SCHEME: "${PHX_SCHEME:-http}"
      PHX_SERVER: "true"
      PORT: "4000"
      LLM_PROVIDER: "${LLM_PROVIDER:-openrouter}"
      LLM_MODEL: "${LLM_MODEL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ~/.claude:/app/.claude:ro
      - pearl_repos:/app/repos
    restart: unless-stopped

volumes:
  pearl_pgdata:
  pearl_repos:
